name: net-bridge
on:
  push:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: egress probe
        run: |
          set -x
          echo "== whoami/host =="; whoami; hostname
          echo "== public IP =="; curl -s --max-time 20 https://api.ipify.org || echo "ipify failed"
          echo "== example.com =="; curl -s -o /dev/null -w "%{http_code}\n" --max-time 20 https://example.com || true
          echo "== pypi =="; curl -s -o /dev/null -w "%{http_code}\n" --max-time 20 https://pypi.org/simple/ || true
          echo "== dns =="; getent hosts github.com || true
          echo "== done =="
