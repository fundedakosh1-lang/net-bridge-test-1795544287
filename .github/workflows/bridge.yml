name: bridge
on:
  push:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in 'https://www.bing.com/search?format=rss&q=portable%20blender%20price%20Alibaba' 'https://www.bing.com/search?format=rss&q=portable%20blender%20AliExpress%20price' 'https://www.bing.com/search?format=rss&q=portable%20blender%20Temu%20price' 'https://www.bing.com/search?format=rss&q=Shopify%20store%20portable%20blender%20price' 'https://www.bing.com/search?format=rss&q=site%3A1688.com%20portable%20blender'; do echo ==== ; curl -Ls --max-time 15 -A 'Mozilla/5.0' "$u" | python3 -c 'import sys,xml.etree.ElementTree as E,html,re; d=sys.stdin.read();\ntry:\n r=E.fromstring(d);\n for i in r.findall(".//item")[:6]: print(i.findtext("title"),"|",i.findtext("link"),"|",re.sub("<.*?>","",html.unescape(i.findtext("description") or ""))[:250])\nexcept Exception as e: print("NONRSS",len(d),d[:180])'; done
