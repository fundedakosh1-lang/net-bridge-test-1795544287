name: bridge
on:
  push:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -Ls --max-time 25 -A 'Mozilla/5.0' 'https://www.aliexpress.com/w/wholesale-portable-blender.html' | python3 -c 'import sys,re,html; d=sys.stdin.read(); print("bytes",len(d)); print("title",re.findall("<title[^>]*>(.*?)</title>",d,re.S)[:1]); print("prices",list(dict.fromkeys(re.findall(r"(?:US\$|\$)\s?\d+(?:\.\d{1,2})?",html.unescape(d))))[:30]); print("matches",[html.unescape(x)[:250] for x in re.findall(r".{0,80}(?:portable blender|juicer|US\$\d+).{0,130}",d,re.I)[:15]])'
