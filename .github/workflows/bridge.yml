name: bridge
on:
  push:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 -c "import urllib.request,urllib.parse; u=\"https://www.bing.com/search?q=\"+urllib.parse.quote(\"Trump NVIDIA Jensen Huang Chinese spy stock scandal\"); r=urllib.request.Request(u,headers={\"User-Agent\":\"Mozilla/5.0\"}); d=urllib.request.urlopen(r,timeout=20).read().decode(\"utf8\",\"ignore\"); print(d[:9000])"
